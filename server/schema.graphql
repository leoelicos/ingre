type User {
    _id: ID!
    firstName: String!
    lastName: String!
    email: String!
    pro: Boolean!
    savedRecipes: [Recipe!]!
    numSavedRecipes: Int!
  }

  input UserInput {
    firstName: String!
    lastName: String!
    email: String!
    password: String!
  }

  type Recipe {
    _id: ID!
    name: String!
    portions: Int!
    ingredients: [Ingredient!]!
    picture_url: String!
    libraryId: String
    instructions: String
    customisations: [Customisation!]!
  }

  # #182: one type per kind of change, so no field is ever empty
  type AddedIngredient {
    ingredientId: String!
    to: Float!
  }

  type RemovedIngredient {
    ingredientId: String!
    from: Float!
  }

  type ChangedIngredient {
    ingredientId: String!
    from: Float!
    to: Float!
  }

  type PortionsChange {
    from: Int!
    to: Int!
  }

  union Customisation =
    | AddedIngredient
    | RemovedIngredient
    | ChangedIngredient
    | PortionsChange

  input AddedIngredientInput {
    ingredientId: String!
    to: Float!
  }

  input RemovedIngredientInput {
    ingredientId: String!
    from: Float!
  }

  input ChangedIngredientInput {
    ingredientId: String!
    from: Float!
    to: Float!
  }

  input PortionsChangeInput {
    from: Int!
    to: Int!
  }

  input CustomisationsInput {
    added: [AddedIngredientInput!]!
    removed: [RemovedIngredientInput!]!
    changed: [ChangedIngredientInput!]!
    portions: PortionsChangeInput
  }

  input RecipeInput {
    name: String!
    portions: Int!
    ingredients: [IngredientInput!]!
    picture_url: String!
    libraryId: String
    instructions: String
    customisations: CustomisationsInput!
  }
  type Ingredient {
    _id: ID!
    name: String!
    quantity: Float!
    measure: String!
    category: Category!
    "catalogue id (#182); missing on recipes saved before it"
    ingredientId: String
  }

  input IngredientInput {
    name: String!
    quantity: Float!
    measure: String!
    category: String!
    ingredientId: String!
  }

  type Category {
    _id: ID!
    name: String!
  }

  type Checkout {
    session: String!
  }

  type Auth {
    token: String!
    user: User!
  }

  # recipe
  type Query {
    getRecipe(_id: ID!): Recipe!
  }

  type Mutation {
    saveRecipe(input: RecipeInput!): Recipe!
    removeRecipe(recipeId: ID!): Boolean!
  }

  # session
  type Query {
    checkout: Checkout!
  }

  type Mutation {
    login(email: String!, password: String!): Auth!
  }

  # user
  type Query {
    getUser: User!
    getSavedRecipes: [Recipe!]!
    getNumSavedRecipes: Int!
    checkEmailAlreadyExists(email: String!): Boolean!
  }

  type Mutation {
    addUser(input: UserInput!): Auth!
    makeUserPro: User!
  }
