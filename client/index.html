<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/ingre-icon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/ingre-icon-16.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <script>
      /* Android app only (#296): draw under the status bar so the page can clear it with the
         top safe-area inset (--safe-top in src/index.css). Web and iOS keep the viewport as is. */
      ;(function () {
        var cap = window.Capacitor
        if (!cap || typeof cap.getPlatform !== 'function') return
        if (cap.getPlatform() !== 'android') return
        var meta = document.querySelector('meta[name=viewport]')
        if (meta && meta.content.indexOf('viewport-fit=cover') === -1) {
          meta.content += ', viewport-fit=cover'
        }
      })()
    </script>
    <meta
      name="theme-color"
      content="#000000"
    />
    <meta
      name="description"
      content="ingré"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/ingre-icon-180.png"
    />
    <link
      rel="manifest"
      href="/manifest.json"
    />
    <title>ingré</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script
      type="module"
      src="/src/index.tsx"
    ></script>
  </body>
</html>
