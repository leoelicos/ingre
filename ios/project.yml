# #195: the Xcode project is generated from this spec with XcodeGen (`xcodegen generate`);
# Ingre.xcodeproj is not committed. See README "iOS app".
name: Ingre
options:
  bundleIdPrefix: app.ingre
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
packages:
  Apollo:
    url: https://github.com/apollographql/apollo-ios
    exactVersion: "2.4.0"
targets:
  Ingre:
    type: application
    platform: iOS
    sources:
      - path: Ingre
    dependencies:
      - package: Apollo
        product: Apollo
    preBuildScripts:
      - name: Copy recipe data
        # The one source is client/src/data; never keep a copy in ios/ (scripts/copy-native-data.sh).
        script: |
          "$SRCROOT/../scripts/copy-native-data.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        inputFiles:
          - $(SRCROOT)/../client/src/data/recipes.json
          - $(SRCROOT)/../client/src/data/ingredients.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/recipes.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ingredients.json
    info:
      path: Ingre/Resources/Info.plist
      properties:
        CFBundleDisplayName: ingré
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        IngreGraphQLURL: $(INGRE_GRAPHQL_URL)
        IngreWebOrigin: $(INGRE_WEB_ORIGIN)
        IngreCheckoutBaseURL: $(INGRE_CHECKOUT_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: app.ingre.ios.upgrade
            CFBundleURLSchemes: [ingre]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: "NO"
  IngreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IngreTests
    dependencies:
      - target: Ingre
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
  IngreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IngreUITests
    dependencies:
      - target: Ingre
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Ingre
schemes:
  Ingre:
    build:
      targets:
        Ingre: all
        IngreTests: [test]
        IngreUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - IngreTests
        - IngreUITests
