name: Ingre
options:
  bundleIdPrefix: com.leoelicos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Store versions: see docs/MOBILE.md. Bump both before every store upload.
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
packages:
  IngreCore:
    path: IngreCore
targets:
  Ingre:
    type: application
    platform: iOS
    sources:
      - Ingre
    dependencies:
      - package: IngreCore
      # #314: App Store subscriptions (StoreKit 2)
      - sdk: StoreKit.framework
    settings:
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.leoelicos.ingre
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: INGRE
      INFOPLIST_FILE: Ingre/Info.plist
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  # #314: StoreKit tests against Ingre.storekit (SKTestSession), hosted in the app
  IngreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IngreTests
      - path: Ingre.storekit
        buildPhase: resources
    dependencies:
      - target: Ingre
      - sdk: StoreKitTest.framework
    settings:
      SWIFT_VERSION: "6.0"
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.leoelicos.ingre.tests
  IngreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - IngreUITests
    dependencies:
      - target: Ingre
    settings:
      SWIFT_VERSION: "6.0"
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.leoelicos.ingre.uitests
schemes:
  Ingre:
    build:
      targets:
        Ingre: all
    run:
      # #314: local StoreKit testing in the simulator (Xcode signs these; the server refuses them)
      storeKitConfiguration: Ingre.storekit
    test:
      targets:
        - IngreTests
        - IngreUITests
