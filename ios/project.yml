name: Ingre
options:
  bundleIdPrefix: app.ingre
  deploymentTarget:
    iOS: "26.0"
packages:
  IngreCore:
    path: IngreCore
targets:
  Ingre:
    type: application
    platform: iOS
    sources:
      - Ingre
    dependencies:
      - package: IngreCore
      # #314: App Store subscriptions (StoreKit 2)
      - sdk: StoreKit.framework
    settings:
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: app.ingre
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  # #314: StoreKit tests against Ingre.storekit (SKTestSession), hosted in the app
  IngreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IngreTests
      - path: Ingre.storekit
        buildPhase: resources
    dependencies:
      - target: Ingre
      - sdk: StoreKitTest.framework
    settings:
      SWIFT_VERSION: "6.0"
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: app.ingre.tests
  IngreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - IngreUITests
    dependencies:
      - target: Ingre
    settings:
      SWIFT_VERSION: "6.0"
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: app.ingre.uitests
schemes:
  Ingre:
    build:
      targets:
        Ingre: all
    run:
      # #314: local StoreKit testing in the simulator (Xcode signs these; the server refuses them)
      storeKitConfiguration: Ingre.storekit
    test:
      targets:
        - IngreTests
        - IngreUITests
