name: Ingre
options:
  bundleIdPrefix: com.leoelicos
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    # Store versions: see docs/MOBILE.md. Bump both before every store upload.
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
packages:
  IngreCore:
    path: IngreCore
targets:
  Ingre:
    type: application
    platform: iOS
    sources:
      - Ingre
    dependencies:
      - package: IngreCore
    settings:
      SWIFT_VERSION: "6.0"
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.leoelicos.ingre
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_FILE: Ingre/Info.plist
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  IngreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - IngreUITests
    dependencies:
      - target: Ingre
    settings:
      SWIFT_VERSION: "6.0"
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.leoelicos.ingre.uitests
schemes:
  Ingre:
    build:
      targets:
        Ingre: all
    test:
      targets:
        - IngreUITests
