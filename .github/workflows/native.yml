name: native

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios:
    # ubuntu-latest is 26.04, which swift-actions/setup-swift does not support yet.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Copy the catalogue
        run: node scripts/copy-native-library.mjs
      - name: Unit tests
        run: swift test
        working-directory: ios/IngreCore
