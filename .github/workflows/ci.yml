name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Client typecheck (strict)
        run: npx tsc --noEmit
        working-directory: client

      - name: Client lint
        run: npm run lint -- --max-warnings 0
        working-directory: client

      - name: Client prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
        working-directory: client

      - name: Client unit tests with coverage
        run: npm test -- --coverage --coverageThreshold='{"global":{"branches":100,"functions":100,"lines":100,"statements":100}}'
        working-directory: client

      - name: Client production build
        run: npm run build
        working-directory: client

      - name: Server unit tests
        run: npm test
        working-directory: server

  # #175: one `npm test` from the root: unit tests, then Playwright e2e.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            automation/package-lock.json
      - name: Setup Java (WireMock standalone)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server
          npm ci --prefix automation
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: automation
      - name: Debug prettier
        working-directory: automation
        run: |
          echo "=== prettier version ==="
          npx --prefix . prettier --version
          echo "=== resolved config ==="
          npx --prefix . prettier --find-config-path tests/layout.spec.ts
          npx --prefix . prettier --log-level debug --check tests/layout.spec.ts || true
          echo "=== diff for layout.spec.ts ==="
          npx --prefix . prettier --write tests/layout.spec.ts
          git diff tests/layout.spec.ts || true
          echo "=== diff for page.ts ==="
          npx --prefix . prettier --write tests/page.ts
          git diff tests/page.ts || true
          echo "=== diff for sections.spec.ts ==="
          npx --prefix . prettier --write tests/sections.spec.ts
          git diff tests/sections.spec.ts || true
      - name: npm test (unit + e2e)
        run: npm test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            automation/playwright-report
            automation/test-results
          retention-days: 7
