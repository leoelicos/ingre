name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Client typecheck (strict)
        run: npx tsc --noEmit
        working-directory: client

      - name: Client lint
        run: npm run lint -- --max-warnings 0
        working-directory: client

      - name: Client prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
        working-directory: client

      - name: Client unit tests with coverage
        run: npm test -- --coverage --coverageThreshold='{"global":{"branches":100,"functions":100,"lines":100,"statements":100}}'
        working-directory: client

      - name: Client production build
        run: npm run build
        working-directory: client

      - name: Server unit tests
        run: npm test
        working-directory: server
